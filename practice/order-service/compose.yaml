services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a local development password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
  api-a:
    profiles: [app]
    build: .
    image: order-lab-api:local
    environment: &api-environment
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USERNAME: orders
      DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/init-env.sh first}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  api-b:
    profiles: [app]
    image: order-lab-api:local
    build: .
    environment: *api-environment
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api-a: {condition: service_healthy}
      api-b: {condition: service_healthy}
volumes:
  orders-data:
