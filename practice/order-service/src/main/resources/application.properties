spring.application.name=order-service
server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/orders}
spring.datasource.username=${DB_USERNAME:orders}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8

# Exercise 003: per-instance concurrent carrier calls; simulator purchases no postage.
shipping.max-concurrent=2
shipping.demo-delay-millis=1000

# Exercise 005: shared document-generation lease; PostgreSQL owns durable results.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
invoice.document.lease-millis=30000
invoice.document.demo-delay-millis=5000
